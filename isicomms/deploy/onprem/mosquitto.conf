# Central MQTT broker for the distributed ISI Monitor 3D deployment.
# All Backbone nodes publish here; the isi-gateway subscribes here.

listener 1883

# Persistence keeps RETAINED messages (each node's `.../config` advert) across
# broker restarts, so a gateway that (re)connects still learns every node's
# layout without waiting for the node to republish.
persistence true
persistence_location /mosquitto/data/

# --- LOCAL DEV ONLY ---------------------------------------------------------
# Anonymous access is fine on a trusted LAN / localhost. BEFORE exposing the
# broker to the internet, disable this and add credentials + TLS (see below).
allow_anonymous true

# --- CLOUD / PRODUCTION (uncomment + configure) -----------------------------
# allow_anonymous false
# password_file /mosquitto/config/passwd          # mosquitto_passwd -c passwd <user>
#
# listener 8883                                   # TLS listener
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# Then set each node's mqtt sink (tls/username/password) and the gateway's
# ISI_GATEWAY_MQTT_TLS / _MQTT_USERNAME / _MQTT_PASSWORD accordingly.
