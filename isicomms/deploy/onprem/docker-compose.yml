# On-prem (LAN) profile — plaintext, anonymous, trusted network.
# Run:  docker compose -f docker-compose.yml up -d --build
# Broker on :1883, polling API + probe UI on http://<host>:8080/ui.
#
# HOST PORTS are overridable — either inline:
#   ISICOMMS_GATEWAY_PORT=9090 ISICOMMS_MQTT_PORT=11883 docker compose up -d
# or via a .env file next to this compose file:
#   ISICOMMS_GATEWAY_PORT=9090
#   ISICOMMS_MQTT_PORT=11883
# (Container-internal ports stay 8080/1883; only the host side moves. If
# monitor_web's gateway proxy is configured, update its gateway_url to match.)
#
# Each warehouse-PC Backbone points its mqtt sink at this broker
# (host = this server, prefix = isiMonitor3D/v1/<node_id>); the gateway aggregates them.
#
# Optional auth (still plaintext): set allow_anonymous false + password_file in
# mosquitto.conf and uncomment ISI_GATEWAY_MQTT_USERNAME/PASSWORD below.
# For internet-facing deployments use the cloud profile (deploy/cloud/) instead.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "${ISICOMMS_MQTT_PORT:-1883}:1883"      # MQTT plaintext (host port overridable)
      - "${ISICOMMS_MQTT_WS_PORT:-9001}:9001"   # MQTT over WebSockets

  gateway:
    build:
      context: ../../..                  # repo root — the image needs backbone/
      dockerfile: isicomms/Dockerfile
    restart: unless-stopped
    environment:
      ISI_GATEWAY_MQTT_HOST: mosquitto
      ISI_GATEWAY_MQTT_PORT: "1883"
      ISI_GATEWAY_MQTT_BASE: isiMonitor3D
      # ISI_GATEWAY_API_TOKEN: "change-me"     # require Bearer auth on the API
      # ISI_GATEWAY_MQTT_TLS: "true"           # + _MQTT_USERNAME / _MQTT_PASSWORD
    ports:
      - "${ISICOMMS_GATEWAY_PORT:-8080}:8080"   # REST API + /ui (host port overridable)
    depends_on:
      - mosquitto

volumes:
  mosquitto_data:
