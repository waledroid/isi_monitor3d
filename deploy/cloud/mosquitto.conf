# Cloud / internet-facing MQTT broker configuration.
# All Backbone nodes publish here; the isi-gateway subscribes here.
# TLS on :8883, username/password auth, no anonymous access.

listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

# Clients authenticate by username/password (not client certificates).
require_certificate false

allow_anonymous false
password_file /mosquitto/config/passwd

# Persistence keeps RETAINED messages (each node's .../config advert) across
# broker restarts so a gateway that (re)connects still learns every node's
# layout without waiting for the node to republish.
persistence true
persistence_location /mosquitto/data/
