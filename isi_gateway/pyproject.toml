[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isi-gateway"
version = "0.0.1"
description = "Cloud aggregator gateway for distributed ISI Monitor 3D nodes (MQTT → REST)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Isitec" }]
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "paho-mqtt>=1.6,<3",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "isi-monitor3d-backbone",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["isi_gateway*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
