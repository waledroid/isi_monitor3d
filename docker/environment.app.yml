# Conda env for docker/Dockerfile.app (CPU deployment image) — the same
# dependency set as the repo-root environment.yml, except:
#   - name: base (micromamba installs into the image's base env)
#   - no `--editable .` pip line (the Dockerfile pip-installs /opt/isi itself)
# Keep the two files in sync when editing dependencies.
name: base
channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.10
  - pip>=24

  - numpy>=1.26
  - scipy>=1.11

  # OpenCV — conda-forge headless build (GStreamer + FFmpeg compiled in).
  - opencv=4.13.*=headless_py310*

  # Video pipeline — GStreamer + PyGObject (PyGI), NOT gst-python (see
  # environment.yml for the FFmpeg diamond-conflict rationale). Software
  # decode only — this image is CPU-only.
  - ffmpeg
  - gstreamer>=1.22
  - gst-plugins-base
  - gst-plugins-good
  - gst-plugins-bad
  - gst-libav
  - pygobject>=3.46

  # Kalman filtering.
  - filterpy>=1.4.5

  # ALL inference: OpenVINO IR on CPU.
  - openvino>=2024.0

  # Metadata schemas + dashboard.
  - pydantic>=2.6
  - fastapi>=0.115
  - uvicorn>=0.30
  - jinja2>=3.1

  - pyyaml>=6.0

  - pip:
    - paho-mqtt>=1.6,<3
