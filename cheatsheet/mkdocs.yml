site_name: ISI Monitor 3D — Cheat Sheet
site_description: Warehouse vision backbone — RTSP to metric Track2D/Track3D over UDP/JSON + MQTT
site_url: ""
use_directory_urls: true

theme:
  name: material
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Outfit
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Modularity: modularity.md
  - System tree: structure.md
  - Datasets & training: datasets.md
  - Detection pipeline: detection.md
  - Wire, MQTT & probe: comms.md
