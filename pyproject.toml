[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isi-monitor3d-backbone"
version = "0.0.1"
description = "Industrial vision Backbone for ISI Monitor 3D (Isitec)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Isitec" }]
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
geometry = [
    "opencv-python>=4.9",
    "filterpy>=1.4.5",
    "scipy>=1.11",
]
detection = [
    "ultralytics>=8.3",
]
schemas = [
    "pydantic>=2.6",
]
# Multical 0.4.0 pins opencv-contrib-python <=4.7, which conflicts with the
# runtime OpenCV 4.13+. DO NOT install this extra into the project env.
# Use `bash calibration/setup_multical.sh` instead — it builds an isolated
# venv at calibration/.venv-multical/ that `calibrate.py` invokes by absolute
# path. This block exists only to document the pinned version.
calibration = [
    "multical==0.4.0",
]
mqtt = [
    "paho-mqtt>=1.6,<3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["backbone*", "calibration*", "isistream*"]

[tool.setuptools.package-data]
# The Multical venv bootstrap must ship in the wheel so a pip-installed
# calibration/ (e.g. an exported isical folder) can still create .venv-multical.
calibration = ["setup_multical.sh"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "calibration/tests"]
addopts = "-ra --strict-markers"
