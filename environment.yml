# ISI Monitor 3D — CPU deployment environment (branch `cpu`).
#
# Create:
#     conda env create -f environment.yml -n monitor3d-cpu
#     conda activate monitor3d-cpu
#     pip install --no-deps -e monitor_web -e isicomms   # dashboard + gateway
#
# Refresh after edits:
#     conda env update -f environment.yml -n monitor3d-cpu --prune
#
# CPU-ONLY by design: no CUDA, no onnxruntime, no TensorRT — every model in
# this branch is an OpenVINO IR (`model.xml` + `model.bin` under models/),
# executed on the CPU (Intel iGPU also works via `detection.device`).
# Convert models once in the training env: `ovc model.onnx --output_model model.xml`.
#
# Multical (Mode-2 calibration BA) is NOT part of this branch — single-camera
# Mode 1 calibrates in-app (dashboard ▸ ruler ▸ 4 pallet corners).

name: monitor3d-cpu
channels:
  - conda-forge
  - nodefaults

dependencies:
  # Interpreter — same 3.10 the GPU line uses (shared codebase).
  - python=3.10
  - pip>=24

  # Scientific stack.
  - numpy>=1.26
  - scipy>=1.11

  # OpenCV — conda-forge headless build for py3.10 (no Qt, no display deps;
  # the runtime is a service). The headless variant still ships with full
  # GStreamer + FFmpeg support, which the RTSP ingest needs.
  - opencv=4.13.*=headless_py310*

  # Video pipeline runtime — GStreamer + PyGObject (see the GPU line's notes:
  # pygobject introspects whatever GStreamer is installed; no pin conflicts).
  - ffmpeg
  - gstreamer>=1.22
  - gst-plugins-base
  - gst-plugins-good
  - gst-plugins-bad
  - gst-libav
  - pygobject>=3.46

  # 2D Kalman filtering (homography layer).
  - filterpy>=1.4.5

  # ALL inference: OpenVINO IR on CPU/Intel-iGPU.
  - openvino>=2024.0

  # Metadata UDP/JSON envelopes are pydantic-validated and versioned.
  - pydantic>=2.6

  # Operator dashboard (monitor_web/, separate FastAPI process).
  - fastapi>=0.115
  - uvicorn>=0.30
  - jinja2>=3.1

  # Configuration files.
  - pyyaml>=6.0

  # Dev tooling. `onnx` is TEST-ONLY: the hermetic suites fabricate stub
  # models with it and OpenVINO's read_model() loads .onnx natively — the
  # runtime itself never imports it (no onnxruntime anywhere).
  - onnx>=1.20
  - pytest>=8.0
  - pytest-cov>=4.1
  - ruff>=0.4

  # The project itself — editable install. No extras: the conda packages
  # above already satisfy `[geometry]`, and the `opencv-python` PyPI wheel
  # in that extra would collide with conda's `opencv`.
  - pip:
    - --editable .
    - paho-mqtt>=1.6,<3
