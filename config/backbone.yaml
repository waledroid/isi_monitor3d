node_id: Sortie_Machine_4_cpu
calibration_path: /home/aatanda/isi_monitor3d_cpu/config/mode1/calibration.json
cameras:
  cam_a:
    source:
      name: rtsp
      url: rtsp://admin:admin123@192.168.2.200/cam/realmonitor?channel=1&subtype=0
      latency_ms: 100
      capture_fps: 25
      decoder: software
      output_wh:
      - 1280
      - 720
    detect_source:
      name: rtsp
      url: rtsp://admin:admin123@192.168.2.200/cam/realmonitor?channel=1&subtype=1
      latency_ms: 100
      decoder: software
ingestion:
  frame_sync:
    max_skew_ms: 33.0
    max_age_ms: 1000.0
    buffer_size: 8
    degraded_emit_after_ms: 100.0
  frame_bus:
    default_maxsize: 2
  mode: points
  points:
    listen_host: 127.0.0.1
    listen_port: 9012
    max_skew_ms: 60.0
    degraded_emit_after_ms: 200.0
detection:
  plugin: yolo_openvino_seg
  model_xml: /home/aatanda/isi_monitor3d_cpu/models/pallet_seg_openvino/model.xml
  device: CPU
  class_names:
  - palette
  - carton
  - polybag
  confidence_threshold: 0.25
  pose_confidence_threshold: 0.5
  inference_imgsz: 640
  pose_every_n: 3
  pose_model_xml: /home/aatanda/isi_monitor3d_cpu/models/yolo11n_pose_openvino/model.xml
  pose_imgsz: 480
  pose_enabled: true
  zone_imgsz: 320
  zone_membership_tol_m: 0.5
  sahi:
    enabled: false
    tile: 2
    overlap: 0.2
  enhance:
    enabled: true
    gamma: 0.88
homography:
  cross_cam_fusion:
    match_distance_m:
      palette_vide: 0.8
      palette: 1.0
      carton: 1.0
  disagreement_gate:
    agreement_distance_m:
      palette_vide: 0.4
      palette: 0.8
      carton: 0.8
  tracker:
    plugin: bytetrack
    conf_high: 0.5
    conf_low: 0.1
    match_distance_m:
      palette_vide: 1.0
  track_config:
    process_noise: 0.1
    measurement_noise_m: 0.05
    min_hits_to_confirm: 3
    max_lost_frames: 30
    class_history_window: 5
  stabilizer:
    min_frames_confirmed: 1
metadata:
  area: Zone A
  diagnostics:
    enabled: true
    interval_sec: 5.0
    rms_gate_px: 2.0
  sinks:
  - plugin: udp
    host: 127.0.0.1
    port: 9003
  - plugin: mqtt
    host: 127.0.0.1
    port: 1883
    prefix: isiMonitor3D/v1/Sortie_Machine_4_cpu
  images:
    enabled: false
    out_dir: /var/lib/isi_monitor3d/snapshots
    url_base: file:///var/lib/isi_monitor3d/snapshots
    jpeg_quality: 85
    on_event: enter
zones_path: /home/aatanda/isi_monitor3d_cpu/config/zones.yaml
subscriptions_path: /home/aatanda/isi_monitor3d_cpu/config/mode2/subscriptions.yaml
isistream:
  fps: 15.0
  motion_gate: true
  detect_substream: false
