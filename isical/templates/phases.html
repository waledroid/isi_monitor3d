{% extends "base.html" %}
{% block nav %}
<nav class="crumbs"><a href="/">calibrations</a> / <b>{{ project }}</b></nav>
{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ project }} — calibration
    <button id="refresh-board" class="ghost-btn" title="Refresh status now">⟳ Refresh</button>
  </h1>
  <form id="cams-form" class="create-form cams-inline">
    <fieldset class="cam-fieldset">
      <legend>cam_a</legend>
      <label>Type <select name="a_type">
        <option value="rtsp">RTSP</option><option value="usb">USB</option></select></label>
      <label>Source <input name="a_src" placeholder="rtsp://…"></label>
    </fieldset>
    <fieldset class="cam-fieldset">
      <legend>cam_b <span class="msg">(blank = Mode 1)</span></legend>
      <label>Type <select name="b_type">
        <option value="rtsp">RTSP</option><option value="usb">USB</option></select></label>
      <label>Source <input name="b_src" placeholder="rtsp://…  (blank = remove)"></label>
    </fieldset>
    <button type="submit">Save cameras</button>
    <span id="cams-msg" class="msg"></span>
  </form>
  <div id="phase-board" class="phase-board" data-project="{{ project }}">loading…</div>
</section>
<section class="card">
  <h2>Job log</h2>
  <pre id="job-log" class="job-log">—</pre>
</section>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/phases.js"></script>{% endblock %}
