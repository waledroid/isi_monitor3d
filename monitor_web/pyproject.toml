[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isi-monitor3d-web"
version = "0.0.1"
description = "Operator dashboard for ISI Monitor 3D (FastAPI + HTMX + Material Web)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Isitec" }]
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "isi-monitor3d-backbone",     # sibling: schemas, ZoneRegistry, RtspFrameSource
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",                 # FastAPI TestClient transport
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["monitor_web*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
