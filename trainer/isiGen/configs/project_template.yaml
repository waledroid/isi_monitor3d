# isiGen project template — copied into data/<name>/project.yaml on project
# creation (classes are replaced by the ones you give create_project).
#
# A project = ONE dataset type. Phases read their own sub-dict; plugin names
# are registry keys (src/stages/*/base.py registries).

name: __template__
classes:                       # unique names, unique triggers, unique colors
  - {name: palette, trigger: ISI_PLT,   color: [220, 40, 40]}
  - {name: carton,  trigger: ISI_CRTN,  color: [40, 200, 40]}
  - {name: polybag, trigger: ISI_PLYBG, color: [40, 90, 230]}

# How Phase 6/7 synthesize. "auto" (default): if the project has BACKGROUND images
# (curate a `bg`/`background` folder), use copy_paste + sdxl_inpaint (paste real
# cutouts onto real scenes, harmonize the seam — best when monocular depth can't see
# the object, e.g. black/featureless or irregular items); otherwise the depth path
# (depth_remix + sdxl_controlnet). Force with "copy_paste" / "depth".
synthesis_mode: auto

phases:
  # ── Phase 1: curate real images ────────────────────────────────────────────
  curate:
    min_side: 512              # warn (not reject) below this
    dedupe: true               # sha256 content dedupe
    strip_exif: true
    jpeg_quality: 95

  # ── Phase 2: dual-layer maps ───────────────────────────────────────────────
  control_maps:
    extractors: [depth_anything_v2, canny]
    depth_anything_v2:
      model_id: depth-anything/Depth-Anything-V2-Small-hf
      device: cuda
    canny:
      low: 100
      high: 200
      blur_ksize: 3
  masking:
    masker: sam2
    sam2:
      model_id: facebook/sam2.1-hiera-small
      device: cuda
      multimask_output: false
      fallback_auto: true      # promptless records → automatic mask generator
    prompt_detector:           # optional auto-prompt detector (detect → box → SAM2)
      onnx_path: null          # null → none (SAM2 only). A detector .onnx auto-prompts SAM2.
      confidence_threshold: 0.35
      # class_map: {}          # optional detector-class → project-class override

  # ── Phase 3: anti-bleed captions ───────────────────────────────────────────
  # captioner: template (random-background bank, instant, offline) OR
  #            blip (image-aware: describes the actual photo, prepends the trigger)
  captioning:
    captioner: template
    blip:                        # used when captioner: blip
      model_id: Salesforce/blip-image-captioning-base
      device: cuda
      max_new_tokens: 40
      template: "{trigger} {description}"
    template:
      patterns:                # slots: {trigger} {class_phrase} {background}
        - "a photo of {trigger} {class_phrase}, {background}"
        - "{trigger} {class_phrase} standing in {background}"
        - "an industrial photo of {trigger} {class_phrase}, {background}"
      class_phrases:
        palette: "wooden transport pallet"
        carton: "cardboard box"
        polybag: "plastic polybag package"
      backgrounds:             # exhaustive background bank — THE anti-bleed mechanism
        - "a busy warehouse aisle with tall metal shelving racks, concrete floor, fluorescent lighting"
        - "a loading dock with an open roller door, daylight, painted floor markings"
        - "an outdoor storage yard on wet asphalt under an overcast sky"
        - "a factory floor with yellow safety lines and parked forklifts"
        - "a cold-storage room with frosted walls and bright LED panels"

  lora:
    trainer: diffusers_sdxl
    rank: 16
    resolution: 768            # 1024 fits the 12 GB card but leaves no margin
    precision: fp16
    gradient_checkpointing: true
    optimizer: adamw_8bit
    max_steps: 2000
    lr: 1.0e-4
    batch_size: 1
    grad_accum: 4
  # Scaffold sources for the DEPTH path (the generator is auto-paired by
  # synthesis_mode — you don't set it here):
  #  - depth_remix      → recombines your REAL (depth, mask) pairs into new layouts.
  #                       Good general default for any object with usable depth.
  #  - box3d_procedural → synthetic rigid-box stacks (pallet + cartons). OPT-IN, and
  #                       only for BOX-SHAPED classes (cartons/pallets) — it renders
  #                       cuboids, so it's wrong for polybags/irregular objects. Add
  #                       it to `sources` only for box classes.
  # When synthesis_mode resolves to copy_paste (backgrounds present), `sources` is
  # ignored and copy_paste + sdxl_inpaint is used instead.
  scaffolds:
    sources: [depth_remix]
    count: 500
    depth_remix: {}
    box3d_procedural: {}       # configured but opt-in; add to `sources` for box classes
    copy_paste:                # depth-aware paste of real object(s) onto a real bg
      # Best with BACKGROUND-ONLY images (empty scenes, no object): put them in a
      # folder named `bg` or `background` at curate (e.g. <class>/img/ + <class>/bg/).
      # Pasting onto an empty background can't overlap an existing object → exact
      # labels. With no backgrounds it falls back to pasting onto object images.
      placement: random        # "random" (default) = random location + scale jitter
                               # (the *_frac / scale_jitter / depth_scale / avoid_overlap
                               # / placement_tries knobs below apply only here).
                               # "original" = paste each object at its REAL source
                               # location + native size — RECOMMENDED when bg + object
                               # come from the SAME fixed camera (lands exactly on the
                               # belt, full, never cut). Pick it on the scaffolds page.
      paste_count: 1           # objects pasted per scene: an int, or [lo, hi] random
                               # ([1, 2] = clean singles + doubles); set via the
                               # scaffolds-page toggle (Exactly 1 / 1–2 random).
      scale_jitter: [0.8, 1.2] # (random only) jitter around the object's REAL frame-size
      min_frac: 0.25           # (random only) floor: object height >= this frac of frame
      max_frac: 0.85           # (random only) ceiling
      depth_scale: true        # (random only) nearer (brighter depth) ⇒ mildly larger
      avoid_overlap: true      # (random only) place clear of existing objects
      placement_tries: 30      # (random only)
      dilate: 9                # inpaint-mask dilation around the paste (seam)
  generation:
    # NOTE: `generator` is AUTO-PAIRED from synthesis_mode (copy_paste→sdxl_inpaint,
    # depth→sdxl_controlnet) — this value is ignored, kept only for reference.
    generator: sdxl_controlnet
    base_model: stabilityai/stable-diffusion-xl-base-1.0
    controlnet: diffusers/controlnet-depth-sdxl-1.0
    vae: madebyollin/sdxl-vae-fp16-fix   # stock SDXL VAE NaNs in fp16
    cpu_offload: true
    steps: 30
    guidance: 7.5
    controlnet_scale: 0.85
    strength: 0.75             # sdxl_inpaint only: low = keep pasted pixels, high = regenerate
    lora_weights: null         # set after phase 4
    width: 1024
    height: 1024
    seed: -1                   # -1 = random per image
  filtering:
    filter: clip_score
    min_score: 0.25
    model_id: openai/clip-vit-base-patch32
  export:
    exporters: [yolo_seg]
    val_fraction: 0.1
