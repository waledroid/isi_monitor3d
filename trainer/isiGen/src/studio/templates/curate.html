{% extends "base.html" %}
{% block nav %}
<nav class="crumbs"><a href="/">projects</a> / <a href="/p/{{ project }}">{{ project }}</a> / <b>curate</b></nav>
{% endblock %}
{% block content %}
<section class="card">
  <h1>Curate — real images</h1>
  <form id="ingest-form" class="create-form" data-project="{{ project }}">
    <label>Server folder <input name="source" required placeholder="/path/to/images"></label>
    <label>Class
      <select name="class_name">
        <option value="">— from subfolder names —</option>
        {% for c in classes %}<option value="{{ c.name }}">{{ c.name }}</option>{% endfor %}
      </select>
    </label>
    <button type="submit">Ingest</button>
    <span id="ingest-msg" class="msg"></span>
  </form>
  <div class="filters" id="class-filters" data-project="{{ project }}">
    <button class="chip active" data-cls="">all</button>
    {% for c in classes %}<button class="chip" data-cls="{{ c.name }}">{{ c.name }}</button>{% endfor %}
    <label class="chip"><input type="checkbox" id="show-excluded"> show excluded</label>
  </div>
  <div id="gallery" class="gallery" data-project="{{ project }}"
       data-classes='{{ classes | tojson }}'>loading…</div>
</section>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/curate.js"></script>{% endblock %}
