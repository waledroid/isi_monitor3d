{% extends "base.html" %}
{% block nav %}
<nav class="crumbs"><a href="/">projects</a> / <b>{{ project }}</b></nav>
{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ project }} — pipeline
    <button id="refresh-board" class="ghost-btn" title="Refresh status now">⟳ Refresh</button>
  </h1>
  <div class="classes">
    {% for c in classes %}
    <span class="chip" style="--c: rgb({{ c.color[0] }},{{ c.color[1] }},{{ c.color[2] }})">{{ c.name }} · {{ c.trigger }}</span>
    {% endfor %}
  </div>
  <div id="phase-board" class="phase-board" data-project="{{ project }}">loading…</div>
</section>
<section class="card">
  <h2>Job log</h2>
  <div id="job-progress" class="job-progress" style="display:none"></div>
  <pre id="job-log" class="job-log">—</pre>
</section>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/phases.js"></script>{% endblock %}
