# trainer/isidet/configs/train_pallet_seg.yaml
# Single-class "palette" instance SEGMENTATION — YOLOv11-seg.
#
# Sibling of train_pallet.yaml (which trains the DETECT head).
# Both consume the same isidet/yolo.py trainer (task-agnostic: handles the
# 3-item detect loss vs 4-item seg loss automatically — Ultralytics infers
# task=segment from the *-seg.pt weights).
#
# Run FROM trainer/isidet/ :
#   conda activate isi-train
#   python scripts/run_train.py --config configs/train_pallet_seg.yaml
#
# Dataset prep (one-shot, from the LabelMe master at video/pallet_seg.v1/):
#   python ../../scripts/labelme_to_yolo.py \
#     --src ../../video/pallet_seg.v1 \
#     --out data/pallet_seg_yolo_seg \
#     --class-name palette --task seg --preserve-splits --force

project_name: "palette_seg"
nc: 1
class_names: ["palette"]
hooks:
  - "IndustrialLogger"

# --- model knobs: YOLOv11 SEGMENTATION ---
model_type: "yolo"
model_size: "m"               # fallback variant if 'weights' is unset
weights: "yolo11m-seg.pt"     # *-seg.pt → Ultralytics auto-selects task=segment
                              # (swap to yolo11s-seg / yolo11m-seg / yolo11l-seg
                              # for more capacity; or a prior best.pt to finetune)
dataset_path: "data/pallet_seg_yolo_seg"
optimizer_config: "configs/optimizers/yolo_optim.yaml"
batch_size: 4                 # seg is heavier than detect; smaller batch
imgsz: 640                    # matches Backbone letterbox(640)
mixed_precision: true
epochs: 60
workers: 2

# --- one-shot export: .pt + .onnx (raw head) + OpenVINO .xml/.bin ---
# Seg exports TWO ONNX outputs (head + mask prototypes); Backbone's coming
# yolo_onnx_seg plugin runs its own NMS + mask decode, so nms=False / opset=17
# matches the detect path.
export_model: true
export_formats: ["onnx", "openvino"]
export_nms: false
export_opset: 17

# === Same warehouse augmentations as the detect config ===
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.5
degrees: 15.0
translate: 0.1
scale: 0.5
shear: 2.0
perspective: 0.0005
fliplr: 0.5
flipud: 0.0
mosaic: 1.0
close_mosaic: 10
mixup: 0.05
copy_paste: 0.1               # mask-aware for seg in Ultralytics
erasing: 0.4
camera_aug: true              # MotionBlur + ImageCompression + GaussNoise + Downscale

inference:
  conf_threshold: 0.3
  tracker:
    track_buffer: 60
    match_thresh: 0.9
  logging:
    enabled: true
    save_interval: 3600
    log_dir: "logs"
  udp:
    enabled: false
    host: "127.0.0.1"
    port: 9502
