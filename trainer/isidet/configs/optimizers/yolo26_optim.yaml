# configs/optimizers/yolo26_optim.yaml
#
# Optimizer/early-stop for the YOLO26m-seg @ 640 run. Same as yolo_optim.yaml but
# patience=25 (per the run request). `epochs` is intentionally NOT set here — the
# merged optimizer config overrides the train config, so epochs must live in the
# train config (authoritative); Ultralytics schedules the cosine LR over it.

optimizer:
  type: "AdamW"
  lr: 0.0005
  weight_decay: 0.0005

  scheduler:
    type: "CosineAnnealing"
    warmup_epochs: 3
    T_max: 100     # synced with total epochs
    eta_min: 0.00001

early_stopping:
  enabled: true
  patience: 20     # 🛑 stop if fitness hasn't improved in 25 epochs (keeps best).
                   # NOTE: a crash + --resume RESETS Ultralytics' early-stop
                   # counter, so on a resumed run enforce it by watching results.csv.
  min_delta: 0.0005
  monitor: "mAP50"
  mode: "max"
  restore_best_weights: true

checkpoint:
  save_best_only: true
  save_frequency: 5
  keep_last: 3
