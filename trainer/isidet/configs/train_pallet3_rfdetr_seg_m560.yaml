# trainer/isidet/configs/train_pallet3_rfdetr_seg_m560.yaml
# 3-class instance SEGMENTATION with RF-DETR-Seg Medium (DINOv2-B/14 backbone) @ 560 px.
# Same classes + same leak-free split as train_pallet3_seg.yaml / *_yolo26.yaml — so
# RF-DETR-Seg can be compared head-to-head with YOLO11-seg / YOLO26-seg on identical data.
#
# Dataset: COCO conversion of pallet3_yolo_seg (already built):
#   python ../../scripts/yolo_seg_to_coco.py --src data/pallet3_yolo_seg --out data/pallet3_coco --force
#
# Run FROM trainer/isidet/ :
#   conda activate isi-train
#   python scripts/run_train.py --config configs/train_pallet3_rfdetr_seg_m560.yaml
#
# NOTE: the optimizer_config below WINS the merge — image_size/epochs/batch_size/
# num_select/early_stopping come from rfdetr_optim_m560.yaml, NOT from this file.

project_name: "pallet3_rfdetr_seg_m560"
nc: 3
class_names: ["palette", "carton", "polybag"]   # COCO ids 1/2/3 (+ _background_ 0)
hooks:
  - "IndustrialLogger"
  - "MemoryCleanup"            # gc + torch.cuda.empty_cache() per epoch (WSL OOM guard)

# --- model: RF-DETR SEGMENTATION (transformer) ---
model_type: "rfdetr"
model_size: "m"               # RFDETRSegMedium (DINOv2-B/14)
dataset_path: "data/pallet3_coco"   # COCO: train/ valid/ test/ + _annotations.coco.json
optimizer_config: "configs/optimizers/rfdetr_optim_m560.yaml"   # ← drives res/epochs/patience

mixed_precision: true

# RF-DETR exports its own ONNX (the backbone yolo_onnx_seg plugin is YOLO-specific;
# an RF-DETR backbone plugin is a separate seam — out of scope for this run).
export_model: true
export_formats: ["onnx", "openvino"]
