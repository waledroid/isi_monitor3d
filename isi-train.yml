# isi-train — the TRAINING conda env (separate from the `monitor3d` runtime env
# on purpose: ultralytics pulls opencv-python, which clashes with monitor3d's
# conda OpenCV). Serves BOTH trainers:
#   - trainer/isidet  (YOLO / RF-DETR detector training)
#   - trainer/isiGen  (synthetic dataset generation: SD 3.5 + SAM2 + DepthAnything)
#
# Recreate (from the repo root, so the pip -r path resolves):
#   conda env create -f isi-train.yml -n isi-train
#
# Conda layer is just Python; everything else is pip, pinned exactly in
# requirements-isi-train.txt (torch 2.10+cu128 = Blackwell sm_120 wheels via the
# extra index declared in that file; SAM2 pinned to a git commit).
#
# After create, sanity-check the GPU:
#   conda run -n isi-train python -c "import torch; print(torch.cuda.get_device_capability())"  # (12, 0)
# HF auth (SD 3.5 Large is gated; needed for isiGen phases 4+):
#   conda run -n isi-train hf auth login
name: isi-train
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip>=24
  - pip:
      - -r requirements-isi-train.txt
variables:
  CUDA_HOME: /usr/local/cuda-12.8
  TORCH_CUDA_ARCH_LIST: "12.0"
